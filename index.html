<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>SHOP THẾ CHÍÍ - Free Fire</title>
  <style>
    body { font-family: Arial; background: #f5f5f5; padding: 20px; }
    h1 { text-align: center; }
    .products { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; }
    .product {
      background: #fff; border: 1px solid #ccc; padding: 10px; width: 180px;
      text-align: center; border-radius: 5px;
    }
    .product img { width: 100%; height: auto; border-radius: 5px; }
    .product button {
      margin-top: 5px; padding: 5px 10px; background: #ff4500; color: #fff; border: none; cursor: pointer;
    }
    .product button:disabled { background: #aaa; cursor: not-allowed; }
  </style>
</head>
<body>
  <h1>SHOP THẾ CHÍÍ - Free Fire</h1>

  <div class="products">
    <!-- Acc còn -->
    <div class="product">
      <img src="images/acc1.jpg" alt="Acc FF #001">
      <h3>Acc FF #001</h3>
      <p>Giá: 50k</p>
      <button onclick="window.open('https://m.me/thechii', '_blank')">Liên hệ mua</button>
    </div>

    <!-- Acc đã bán -->
    <div class="product">
      <img src="images/acc2.jpg" alt="Acc FF #002">
      <h3>Acc FF #002</h3>
      <p>Đã bán</p>
      <button disabled>Đã bán</button>
    </div>

    <!-- Thêm acc khác tương tự -->
  </div>
</body>
</html>
